[tox]
envlist = py,docs,check-formatting,lint
skipsdist = True
usedevelop = True

[testenv]
basepython = python3
deps =
    -r{toxinidir}/dev-requirements.txt
commands =
    coverage run -m pytest {posargs}

[testenv:docs]
deps = -rdocs-requirements.txt
commands =
    # interrogate -vv --fail-under 40 pedalboard


; "ruff" is a linter and formatter, replacing the previous black/flake8 combo.
; These envs mirror the checks run in CI (.github/workflows/all.yml) and fail
; tox if the code isn't formatted or linted correctly.
[testenv:check-formatting]
basepython = python3
deps = ruff
skip_install = true
commands = ruff format --check pedalboard --diff

[testenv:lint]
basepython = python3
deps = ruff
skip_install = true
commands = ruff check pedalboard

[pytest]
addopts = 
testpaths = tests
