name: Deploy Documentation

on:
  push:
    branches:
      - master
    # Cheap pre-filter: a version bump always touches this file, so nothing else can
    # possibly be a release. It is not sufficient on its own -- version.py also carries a
    # copyright header whose year gets bumped annually -- so the check-version-bump job
    # below confirms __version__ actually changed before anything is published.
    # To publish a docs-only fix without cutting a release, use the manual trigger below.
    paths:
      - 'pedalboard/version.py'
    tags:
      - 'v*'  # Run on version tags
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Confirms __version__ actually changed, rather than trusting that version.py was
  # touched -- editing its copyright header must not republish the docs.
  # Shares its logic (and tests) with the release job in all.yml.
  check-version-bump:
    runs-on: ubuntu-latest
    name: "Check for a version bump"
    outputs:
      version-changed: ${{ steps.check.outputs.version-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        run: python ./scripts/detect_release.py

  build-and-deploy:
    needs: [check-version-bump]
    # A manual run always deploys; that's the escape hatch for docs-only fixes.
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.check-version-bump.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update \
          && sudo apt-get install -y pkg-config libsndfile1 \
          libx11-dev libxrandr-dev libxinerama-dev \
          libxrender-dev libxcomposite-dev libxcb-xinerama0-dev \
          libxcursor-dev libfreetype6 libfreetype6-dev \
          libasound2-dev

      - name: Install Dependencies
        env:
          # Optimization settings to improve build speed
          DISABLE_LTO: "1"
          # Avoid NumPy build issues
          NPY_BLAS_ORDER: ""
          NPY_LAPACK_ORDER: ""
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
          pip install -e .
          pip install -r docs-requirements.txt

      - name: Generate Documentation
        run: |
          python scripts/generate_type_stubs_and_docs.py
          # Manually copy the demo directory into place:
          cp -r docs/source/_static/demo docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: docs
          force_orphan: true
          full_commit_message: 'docs: update documentation for ${{ github.ref_name }}' 
